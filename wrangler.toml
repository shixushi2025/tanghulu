# Cloudflare Pages is the Git-connected production target.
# Worker-only deployment uses wrangler.worker.toml and dist/server/wrangler.json.
name = "tanghulu"
compatibility_date = "2026-11-06"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "./dist/pages"

[[kv_namespaces]]
binding = "TANGHULU_VIEWS"
id = "303db6ac434149c19c859a3a870497c1"

[[d1_databases]]
binding = "TANGHULU_DB"
database_name = "tanghulu-db"
database_id = "7a164004-e034-4330-ab2e-9b2c56f82046"

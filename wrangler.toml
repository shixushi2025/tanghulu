# Single Cloudflare Worker: static/CSR UI + /api (D1, KV, admin).
# https://developers.cloudflare.com/workers/static-assets/
# https://developers.cloudflare.com/workers/static-assets/routing/single-page-application/
#
# One command ships both: `npm run deploy` → astro build && wrangler deploy
# No Cloudflare Pages project.

name = "tanghulu"
main = "./worker/src/index.ts"
# SPA asset routing flags apply from 2025-04-01. Pin to a date the
# installed wrangler runtime supports (4.73 warns above 2026-03-12).
compatibility_date = "2026-03-12"

# Official SPA + API pattern. /api/* runs the Worker first; other routes
# serve files from ./dist, then SPA fallback (root index.html).
# Extra run_worker_first paths rewrite CSR shells: SPA fallback is always
# /index.html (home), so /item/:slug and admin edit must hit the Worker
# and ASSETS.fetch the real HTML shell.
assets = { directory = "./dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/api/*", "/item/*", "/admin/items/*/edit"] }

[[kv_namespaces]]
binding = "TANGHULU_VIEWS"
id = "303db6ac434149c19c859a3a870497c1"

[[d1_databases]]
binding = "TANGHULU_DB"
database_name = "tanghulu-db"
database_id = "7a164004-e034-4330-ab2e-9b2c56f82046"
